<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ blog_title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Apply saved theme immediately to prevent flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">&#9632; {{ blog_title }}</a>
    <div class="header-actions">
      <span class="version-badge">{{ app_version }}</span>
      {% if authenticated %}
      <button
        class="theme-toggle"
        id="readonly-toggle"
        type="button"
        aria-label="Toggle readonly mode"
        title="Toggle readonly mode"
      >
        <i id="readonly-icon" class="fa-solid {% if readonly_mode %}fa-lock icon-readonly-on{% else %}fa-lock-open icon-readonly-off{% endif %}" aria-hidden="true"></i>
      </button>
      {% endif %}
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle light and dark mode"
        title="Toggle theme"
      >
        <i id="theme-icon" class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
      {% if auth_required and not authenticated %}
      <a href="/login" class="btn btn-ghost">Login</a>
      {% endif %}
      {% if auth_required and authenticated %}
      <form method="post" action="/logout" class="logout-form">
        <button
          class="theme-toggle"
          type="submit"
          aria-label="Log out"
          title="Log out"
        >
          <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        </button>
      </form>
      {% endif %}
      {% if authenticated %}
      <a href="/new" class="btn btn-primary">+ New Post</a>
      {% endif %}
    </div>
  </header>
  {% block content %}{% endblock %}
  <div id="toast"></div>
  <script>
    // ── Toast ──
    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + type;
      setTimeout(() => t.className = '', 2500);
    }

    // ── Theme toggle ──
    (function() {
      const toggle = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');

      function getTheme() {
        return document.documentElement.getAttribute('data-theme') || 'light';
      }

      function updateIcon() {
        if (getTheme() === 'dark') {
          icon.className = 'fa-solid fa-sun';
        } else {
          icon.className = 'fa-solid fa-moon';
        }
      }

      updateIcon();

      toggle.addEventListener('click', () => {
        const next = getTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });
    })();
    // ── Readonly toggle ──
    (function() {
      const btn = document.getElementById('readonly-toggle');
      const icon = document.getElementById('readonly-icon');
      if (!btn) return; // hidden for unauthenticated visitors
      btn.addEventListener('click', async () => {
        const res = await fetch('/api/settings/readonly', { method: 'POST' });
        if (res.status === 401) {
          window.location.href = '/login';
          return;
        }
        if (!res.ok) {
          showToast('Could not change readonly mode', 'error');
          return;
        }
        const data = await res.json();
        if (data.readonly) {
          icon.className = 'fa-solid fa-lock icon-readonly-on';
        } else {
          icon.className = 'fa-solid fa-lock-open icon-readonly-off';
        }
        showToast(data.readonly ? 'Readonly mode on' : 'Readonly mode off');
        setTimeout(() => location.reload(), 1500);
      });
    })();
  </script>
</body>
</html>
